[package]
name = "uaudt-client"
description = "Read and write OPC-UA structured types (UDTs) through async-opcua, decoded with uaudt-core"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.85"

[dependencies]
uaudt-core = { path = "../uaudt-core", version = "0.1.0" }
async-opcua = { version = "0.19.0", default-features = false, features = ["client"] }
futures = "0.3"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
